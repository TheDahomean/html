<text x="76" y="78" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="700" fill="#16160F">PEBBLE + STEM</text>
<path d="M76 102 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="152" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#8B7355">EDIBLE SYSTEMS  /  FIELD GUIDE</text>
<text x="76" y="239" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="800" fill="#16160F">PINK OYSTER</text>
<text x="76" y="285" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#16160F">FRESH OYSTER MUSHROOMS — PROPOSED</text>
<path d="M76 317 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="380" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">WHAT IT IS</text>
<text x="76" y="423" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Pink oyster mushrooms are named for the pink</text><text x="76" y="460" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">colouration of the caps. This is a proposed Pebble</text><text x="76" y="497" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F"> + Stem label, not a statement of current availability.</text>
<path d="M76 548 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="609" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">IN THE KITCHEN</text>
<text x="76" y="653" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Handle gently and cook thoroughly.</text><text x="76" y="690" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Use in sautéed dishes, stir-fries and other</text><text x="76" y="727" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">fully cooked preparations.</text>
<path d="M76 778 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="840" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">STORAGE + RECORD</text>
<text x="76" y="884" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Keep refrigerated. Confirm availability and handling</text><text x="76" y="921" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">instructions with the farm before retail sale.</text>
<path d="M76 997 H824" stroke="#8B7355" stroke-width="2"/>
