<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-label="Pebble plus Stem GREY OYSTER guide">
<rect width="900" height="1180" fill="#FAFAF8"/>
<text x="76" y="78" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="700" fill="#16160F">PEBBLE + STEM</text>
<path d="M76 102 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="152" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#8B7355">EDIBLE SYSTEMS  /  FIELD GUIDE</text>
<text x="76" y="239" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="800" fill="#16160F">GREY OYSTER</text>
<text x="76" y="285" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#16160F">FRESH OYSTER MUSHROOMS</text>
<path d="M76 317 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="380" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">WHAT IT IS</text>
<text x="76" y="423" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Grey oyster refers to a cultivated oyster mushroom</text><text x="76" y="460" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">listing with grey-toned caps. Colour alone does not</text><text x="76" y="497" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">verify the strain or species.</text>
<path d="M76 548 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="609" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">IN THE KITCHEN</text>
<text x="76" y="653" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Trim the base if necessary, separate the cluster,</text><text x="76" y="690" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">and cook thoroughly. Suitable for stir-fries, sautés</text><text x="76" y="727" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">and cooked sauces.</text>
<path d="M76 778 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="840" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">STORAGE + RECORD</text>
<text x="76" y="884" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Keep refrigerated; inspect freshness before cooking</text><text x="76" y="921" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">and retain the harvest and batch information.</text>
<path d="M76 997 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="1037" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" fill="#16160F">Pebble + Stem  ·  Locally grown near Kiserian</text>
<text x="76" y="1076" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="500" fill="#16160F">+254 713 847 524   ·   @psfarmskenya</text>
<text x="76" y="1130" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#8B7355">EDITORIAL REVIEW  /  VERIFY BEFORE RETAIL RELEASE</text>
</svg>