<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-label="Pebble plus Stem DRIED OYSTER guide">
<rect width="900" height="1180" fill="#FAFAF8"/>
<text x="76" y="78" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="700" fill="#16160F">PEBBLE + STEM</text>
<path d="M76 102 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="152" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#8B7355">EDIBLE SYSTEMS  /  FIELD GUIDE</text>
<text x="76" y="239" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="800" fill="#16160F">DRIED OYSTER</text>
<text x="76" y="285" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#16160F">DRIED OYSTER MUSHROOMS — 250 G CONCEPT</text>
<path d="M76 317 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="380" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">WHAT IT IS</text>
<text x="76" y="423" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Dried oyster mushrooms are cultivated oyster</text><text x="76" y="460" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">mushrooms preserved by removing moisture.</text><text x="76" y="497" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Actual species, batch and drying method require confirmation.</text>
<path d="M76 548 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="609" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">IN THE KITCHEN</text>
<text x="76" y="653" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Rehydrate with potable water under refrigeration</text><text x="76" y="690" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">until pliable, then drain and cook thoroughly.</text><text x="76" y="727" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Use in cooked soups, sauces and stews.</text>
<path d="M76 778 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="840" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">STORAGE + RECORD</text>
<text x="76" y="884" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Keep sealed in a cool, dry place. Check the</text><text x="76" y="921" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">packing date and batch code on the product.</text>
<path d="M76 997 H824" stroke="#8B7355" stroke-width="2"/>
