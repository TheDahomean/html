<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-label="Pebble plus Stem PHOENIX OYSTER guide">
<rect width="900" height="1180" fill="#FAFAF8"/>
<text x="76" y="78" font-family="Inter,Arial,sans-serif" font-size="33" font-weight="700" fill="#16160F">PEBBLE + STEM</text>
<path d="M76 102 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="152" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#8B7355">EDIBLE SYSTEMS  /  FIELD GUIDE</text>
<text x="76" y="239" font-family="Inter,Arial,sans-serif" font-size="68" font-weight="800" fill="#16160F">PHOENIX OYSTER</text>
<text x="76" y="285" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600" fill="#16160F">FRESH OYSTER MUSHROOMS</text>
<path d="M76 317 H824" stroke="#8B7355" stroke-width="2"/>
<text x="76" y="380" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">WHAT IT IS</text>
<text x="76" y="423" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Phoenix is a commercial oyster mushroom listing.</text><text x="76" y="460" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">The exact species or strain for Pebble + Stem batches</text><text x="76" y="497" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">requires verification against farm production records.</text>
<path d="M76 548 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="609" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">IN THE KITCHEN</text>
<text x="76" y="653" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Separate into pieces and cook before eating.</text><text x="76" y="690" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Use in sautéed dishes, stir-fries and cooked soups.</text>
<path d="M76 778 H824" stroke="#DAD8CD" stroke-width="2"/>
<text x="76" y="840" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#8B7355">STORAGE + RECORD</text>
<text x="76" y="884" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">Refrigerate promptly and check the batch details</text><text x="76" y="921" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="400" fill="#16160F">on the individual pack.</text>
<path d="M76 997 H824" stroke="#8B7355" stroke-width="2"/>
